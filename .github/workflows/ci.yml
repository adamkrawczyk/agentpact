name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  api-and-mcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: Build API
        run: npm run -w @agentpact/api build

      - name: Build MCP
        run: npm run -w @agentpact/mcp build

      - name: Test API
        run: npm run -w @agentpact/api test

      - name: Test MCP (if present)
        run: npm run -w @agentpact/mcp test --if-present

      - name: Build + test x402-escrow and the demo seller (node --test)
        run: |
          npm run -w @agentpact/x402-escrow build
          npm run -w @agentpact/x402-escrow test
          npm run -w @agentpact/demo-x402-seller build
          npm run -w @agentpact/demo-x402-seller test
