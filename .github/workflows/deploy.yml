name: Deploy

# ── Why this workflow exists ────────────────────────────────────────────────
# Before 2026-08-28 this repo had 8 workflows (ci, docker, e2e, lint,
# publish-sdks, publish, slither, smoke-prod) and NOT ONE of them deployed.
# docker.yml builds the three images on push to main and stops there, so a
# merged PR shipped only when a human remembered to SSH to the box. That gap
# produced the same incident repeatedly (2026-07-25, 07-29, 07-30, 08-20, and
# again 08-28): PR #115 — "render settlement proof-of-delivery on deal detail
# page" — merged 2026-08-23 as commit 0bbea32 with the section present at
# apps/web/src/index.ts:1133, while
#   curl https://agentpact.xyz/deals/<id> | grep -c 'Settlement Proof-of-Delivery'
# returned 0 five days later. All three hosts were healthy the whole time; the
# WEB build was simply old, and nothing in CI could see it.
#
# ── 2026-09-01 topology correction (issue #118) ─────────────────────────────
# This workflow originally assumed the prod host runs docker-compose. A live
# probe of agentpact-cloud (78.47.94.218) on 2026-08-29/09-01 found that
# assumption was false: there is NO docker on that box at all. Production runs
# four Node processes directly under pm2 (ap-api, ap-web, ap-mcp, ap-relayer),
# started via /opt/agentpact-app/ecosystem.config.js and per-app wrapper
# scripts in /opt/agentpact-app/run/*.sh, each of which `source`s
# /etc/agentpact/.env and execs `node apps/<app>/dist/index.js` (api uses
# apps/api/dist/server.js). Build is npm workspaces (`npm run build` at repo
# root fans out to each workspace's own build script). Migrations run via
# `npm run migrate` (scripts/migrate.ts, a dedicated single-connection
# postgres client) — RUN_MIGRATIONS is deliberately false in every pm2 app's
# env so app boot never races the migration runner. Node on the box is v20.
# The remote step below was rewritten to match this shape: pull, npm ci,
# npm run build (with BUILD_SHA exported so the web tier's /health can prove
# which commit is live — see WEB_FRESHNESS_PROBES in smoke-prod.sh), migrate,
# then `pm2 reload ecosystem.config.cjs` (zero-downtime) followed by a
# `pm2 jlist` check that all four apps report `status":"online"`.
#
# The prod checkout was also found to be a DIVERGENT FORK at the time of this
# probe (32 unpushed local commits, 82 dirty files — see issue #118 steps 1-2,
# not yet resolved as of this workflow change). Because `git reset --hard`
# would silently destroy that history, the remote step now refuses to run
# unless the checkout is clean and matches origin's history, UNLESS the
# workflow_dispatch `force` input is explicitly set to true.
#
# Two halves, both required:
#   1. this workflow — pull the freshly-built commit onto the prod host after
#      main goes green, so a merge deploys itself;
#   2. the web-freshness probe in scripts/smoke-prod.sh — assert the LIVE web
#      tier serves the commit we merged, so if half 1 ever silently stops
#      working the daily smoke goes red instead of staying green.
#
# ── Enablement (one-time, needs Adam's key) ─────────────────────────────────
# This workflow is intentionally INERT until the deploy secrets exist. Without
# them the `preflight` job reports "not configured" and exits 0 — a missing
# secret must never look like a broken pipeline (and must never silently look
# like a successful deploy either; see the smoke gate below). It stays inert
# after this change too: no secrets were added by issue #118 step 3(a), and
# the prod divergence (steps 1-2) is still unresolved, so enabling this
# workflow today would run `git reset --hard` and hit the new guard's refusal
# (or, with force=true, would genuinely discard the 32 unpushed commits —
# don't set force until issue #118 step 2 has adjudicated them).
#
# Required repository secrets:
#   DEPLOY_HOST         prod host (e.g. agentpact.xyz)
#   DEPLOY_USER         ssh user
#   DEPLOY_SSH_KEY      private key, PEM, no passphrase
#   DEPLOY_PATH         absolute path of the checkout on the box (pm2 app root, e.g. /opt/agentpact-app)
# Optional:
#   DEPLOY_PORT         ssh port (default 22)
#
# Manual dry run:  Actions → Deploy → Run workflow → dry_run = true

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Report what would happen; do not touch prod"
        type: boolean
        default: false
      force:
        description: "DESTRUCTIVE: allow git reset --hard to discard local-only commits / dirty files on the box. Only set this after issue #118 step 2 (adjudicate the 32 unpushed commits) is resolved."
        type: boolean
        default: false

concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  preflight:
    name: preflight (secrets configured?)
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - id: check
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          missing=()
          [[ -z "$DEPLOY_HOST"    ]] && missing+=(DEPLOY_HOST)
          [[ -z "$DEPLOY_USER"    ]] && missing+=(DEPLOY_USER)
          [[ -z "$DEPLOY_SSH_KEY" ]] && missing+=(DEPLOY_SSH_KEY)
          [[ -z "$DEPLOY_PATH"    ]] && missing+=(DEPLOY_PATH)
          if [[ ${#missing[@]} -eq 0 ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "✅ deploy secrets present"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Deploy not configured"
              echo ""
              echo "Missing secret(s): \`${missing[*]}\`"
              echo ""
              echo "CD is wired but inert. Add the secrets above and the next"
              echo "green CI run on \`main\` deploys itself. Until then, merges"
              echo "still require a manual deploy on the box."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  deploy:
    name: deploy to prod
    needs: preflight
    # Only on a GREEN CI run (or an explicit manual dispatch), and only when
    # the secrets exist. A red CI must never reach prod.
    if: >-
      needs.preflight.outputs.configured == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Resolve deploy SHA
        id: sha
        run: |
          SHA="${{ github.event.workflow_run.head_sha || github.sha }}"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Deploying $SHA"

      - name: Set up SSH
        if: ${{ !inputs.dry_run }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "${{ secrets.DEPLOY_PORT || 22 }}" -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy (pull, rebuild, migrate, restart)
        if: ${{ !inputs.dry_run }}
        env:
          SHA: ${{ steps.sha.outputs.sha }}
          FORCE: ${{ inputs.force && 'true' || 'false' }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_deploy -p "${{ secrets.DEPLOY_PORT || 22 }}" \
              -o BatchMode=yes -o StrictHostKeyChecking=yes \
              "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
              "set -euo pipefail
               cd '${{ secrets.DEPLOY_PATH }}'
               git fetch origin --prune

               # ── Destructive-reset guard ──────────────────────────────────
               # 'git reset --hard \$SHA' below is destructive: it discards any
               # commit reachable from HEAD but not from \$SHA, and any dirty
               # working-tree change, with no recovery short of a prior backup.
               # This box has, at least once (2026-08-29/09-01), carried 32
               # unpushed local commits and 82 dirty files that a routine reset
               # would have silently destroyed. Refuse by default; only an
               # explicit FORCE=true (workflow_dispatch 'force' input) proceeds.
               # The SHA must exist locally before it can be compared against.
               # 'git log MISSING..HEAD' errors, and with stderr swallowed the
               # pipeline yields 0 lines -- which the check below would read as
               # 'no local-only commits, safe to reset'. That is fail-OPEN on a
               # destructive step: a clean-but-diverged checkout whose fetch
               # failed would be wiped. Verified on the live box 2026-09-01:
               # with the SHA absent, LOCAL_ONLY read 0 while HEAD genuinely
               # carried 32 unreachable commits. Fail CLOSED instead.
               if ! git cat-file -e '$SHA^{commit}' 2>/dev/null; then
                 echo \"REFUSING TO DEPLOY: commit $SHA is not present in the checkout after fetch.\"
                 echo \"Cannot determine what a reset would destroy, so refusing rather than guessing. Check that origin is reachable and the commit was pushed.\"
                 exit 1
               fi
               LOCAL_ONLY=\$(git rev-list --count '$SHA'..HEAD)
               # --untracked-files=no: 'git reset --hard' NEVER touches untracked
               # files, only tracked ones (modified/staged/deleted). Counting
               # untracked files here is over-inclusive: any ops-local untracked
               # file that legitimately lives in the deploy path (e.g.
               # ecosystem.config.cjs, run/*.sh, which are deliberately NOT
               # committed to the repo) would permanently trip this guard on
               # every future deploy even though a reset --hard can't touch them.
               DIRTY=\$(git status --porcelain --untracked-files=no | wc -l | tr -d ' ')
               if [[ \"\$LOCAL_ONLY\" != \"0\" || \"\$DIRTY\" != \"0\" ]] && [[ \"$FORCE\" != \"true\" ]]; then
                 echo \"REFUSING TO DEPLOY: checkout has \$LOCAL_ONLY commit(s) not reachable from $SHA and \$DIRTY dirty tracked file(s).\"
                 echo \"A plain reset --hard would destroy them irrecoverably. Re-run workflow_dispatch with force=true only after these have been adjudicated (see issue #118).\"
                 exit 1
               fi

               git checkout main
               git reset --hard '$SHA'

               # ── Load runtime env ───────────────────────────────────────
               # DATABASE_URL (and everything else the app/migrate script
               # needs) lives in /etc/agentpact/.env, sourced by every pm2
               # start-*.sh wrapper. This remote deploy step is a fresh SSH
               # shell that inherits none of that -- without sourcing it here,
               # 'npm run migrate' falls back to postgres.js's hardcoded
               # localhost/postgres default and fails auth (verified live
               # 2026-09-01, run 33551456424: 'password authentication failed
               # for user \"postgres\"'). set -a exports every var sourced so
               # child processes (tsc, tsx, node) inherit them too.
               #
               # MUST run npm ci / npm run build BEFORE sourcing this file:
               # /etc/agentpact/.env sets NODE_ENV=production, and npm honors
               # NODE_ENV=production by skipping devDependencies -- which
               # includes typescript, tsc, tsx, and @types/* packages the
               # build needs. Sourcing it first breaks the build (verified
               # live 2026-09-01, run 33553065112: 'error TS7016: Could not
               # find a declaration file for module '\''express'\''' -- @types/express
               # was never installed because npm ci saw NODE_ENV=production).
               # ── Build ───────────────────────────────────────────────────
               # npm workspaces monorepo; root 'build' script fans out to
               # api/mcp/web/daemon/relayer-daemon/fulfillment-daemon/sdk.
               # BUILD_SHA is exported into the build env so the web tier's
               # /health can prove which commit prod is serving (see
               # apps/web/src/index.ts and scripts/smoke-prod.sh's WEB
               # freshness probe) instead of the placeholder 'unknown'.
               export BUILD_SHA='$SHA'
               npm ci
               npm run build

               # Now safe to load prod env (build already used its own
               # devDependencies): DATABASE_URL etc. for migrate + pm2.
               set -a
               source /etc/agentpact/.env
               set +a

               # ── Migrate ─────────────────────────────────────────────────
               # RUN_MIGRATIONS=false in every pm2 app's env so app boot never
               # races this. Run it explicitly, once, before reload.
               npm run migrate

               # ── Stamp build provenance ─────────────────────────────────
               # The web tier's /health reports \$BUILD_SHA; smoke-prod's
               # STALE_WEB gate refuses "unknown". The env file is what the
               # start-*.sh wrappers source, so stamp it BEFORE the reload.
               if grep -q '^BUILD_SHA=' /etc/agentpact/.env; then
                 sed -i \"s/^BUILD_SHA=.*/BUILD_SHA='$SHA'/\" /etc/agentpact/.env
               else
                 echo \"BUILD_SHA='$SHA'\" >> /etc/agentpact/.env
               fi

               # ── Reload (zero-downtime) ──────────────────────────────────
               set -a; source /etc/agentpact/.env; set +a
               pm2 reload ecosystem.config.cjs --update-env

               # ── Verify all 4 processes came back online ────────────────
               sleep 3
               NOT_ONLINE=\$(pm2 jlist | python3 -c \"import json,sys; procs=json.load(sys.stdin); bad=[p['name'] for p in procs if p['pm2_env'].get('status') != 'online']; print(','.join(bad))\")
               if [[ -n \"\$NOT_ONLINE\" ]]; then
                 echo \"DEPLOY FAILED: process(es) not online after reload: \$NOT_ONLINE\"
                 pm2 jlist
                 exit 1
               fi
               echo \"All pm2 apps online at $SHA\""

      - name: Dry run summary
        if: ${{ inputs.dry_run }}
        run: |
          {
            echo "### Dry run — nothing touched"
            echo ""
            echo "Would deploy \`${{ steps.sha.outputs.sha }}\` to \`${{ secrets.DEPLOY_HOST }}:${{ secrets.DEPLOY_PATH }}\` (pm2 reload, force=${{ inputs.force }})."
          } >> "$GITHUB_STEP_SUMMARY"

      # ── The gate that makes this honest ──────────────────────────────────
      # A deploy that "succeeded" but left prod on the old build is the exact
      # failure this workflow exists to end. smoke-prod.sh now asserts the LIVE
      # web tier's /health reports a real BUILD_SHA (not "unknown", not a body
      # missing the field entirely), so a no-op deploy fails here instead of
      # being discovered days later by a human grepping the live page.
      - name: Post-deploy smoke (api + web freshness)
        if: ${{ !inputs.dry_run }}
        run: bash scripts/smoke-prod.sh

      - name: Post-deploy smoke artefact
        if: ${{ always() && !inputs.dry_run }}
        run: bash scripts/smoke-prod.sh --json > deploy-smoke.json || true

      - uses: actions/upload-artifact@v4
        if: ${{ always() && !inputs.dry_run }}
        with:
          name: deploy-smoke-${{ github.run_id }}
          path: deploy-smoke.json
          retention-days: 30
