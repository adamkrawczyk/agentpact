version: '3.9'
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: agentpact
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/agentpact
      API_PORT: 4000
      PLATFORM_FEE_PCT: 10
      PLATFORM_WALLET: 0xAgentPactPlatformUSDC
    depends_on:
      - postgres
    ports:
      - "4000:4000"

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    environment:
      API_BASE_URL: http://api:4000
      WEB_PORT: 3000
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  pgdata:
